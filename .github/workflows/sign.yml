name: Sign APK

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: "رابط تحميل ملف APK غير الموقّع"
        required: true
        type: string
      keystore_b64:
        description: "محتوى ملف Keystore بصيغة Base64 (اختياري - إذا تركته فاضي يصنع مفتاح جديد)"
        required: false
        type: string
      keystore_password:
        description: "كلمة مرور الـ Keystore (اختياري)"
        required: false
        type: string
      key_alias:
        description: "اسم المفتاح Alias (اختياري)"
        required: false
        type: string

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - name: تحميل ملف APK
        run: |
          curl -L -o unsigned.apk "${{ inputs.apk_url }}"

      - name: تثبيت أدوات Android build-tools
        run: |
          ANDROID_SDK_ROOT=$HOME/android-sdk
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
          cd $ANDROID_SDK_ROOT/cmdline-tools
          curl -o cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdline-tools.zip
          mv cmdline-tools latest
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_SDK_ROOT "build-tools;34.0.0" > /dev/null
          echo "$ANDROID_SDK_ROOT/build-tools/34.0.0" >> $GITHUB_PATH

      - name: تجهيز الـ Keystore
        run: |
          if [ -n "${{ inputs.keystore_b64 }}" ]; then
            echo "${{ inputs.keystore_b64 }}" | base64 -d > release.keystore
            echo "KS_PASS=${{ inputs.keystore_password }}" >> $GITHUB_ENV
            echo "KS_ALIAS=${{ inputs.key_alias }}" >> $GITHUB_ENV
          else
            keytool -genkeypair -v \
              -keystore release.keystore \
              -alias autokey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android123 -keypass android123 \
              -dname "CN=App Signer, OU=Dev, O=Dev, L=City, S=State, C=US"
            echo "KS_PASS=android123" >> $GITHUB_ENV
            echo "KS_ALIAS=autokey" >> $GITHUB_ENV
          fi

      - name: محاذاة الحزمة (zipalign)
        run: |
          zipalign -p -f 4 unsigned.apk aligned.apk

      - name: توقيع APK (v1+v2+v3)
        run: |
          apksigner sign \
            --ks release.keystore \
            --ks-pass pass:$KS_PASS \
            --ks-key-alias $KS_ALIAS \
            --out signed.apk \
            aligned.apk

      - name: التحقق من التوقيع
        run: |
          apksigner verify signed.apk

      - name: رفع الملف الموقّع
        uses: actions/upload-artifact@v4
        with:
          name: signed-package
          path: signed.apk
